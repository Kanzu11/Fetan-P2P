#!/usr/sbin/nft -f
# Strict host firewall for Oracle Cloud Always Free ARM signer VM.
# Replace 203.0.113.10 with your static admin IP or WireGuard/VPN CIDR before loading!

flush ruleset

table inet filter {
  chain input {
    type filter hook input priority 0; policy drop;

    iifname "lo" accept
    ct state established,related accept

    # Restrict SSH exclusively to admin management IP
    ip saddr 203.0.113.10 tcp dport 22 accept

    # Reject everything else cleanly (no inbound HTTP/API ports on signing VM)
    counter drop
  }

  chain forward {
    type filter hook forward priority 0; policy drop;
  }

  chain output {
    type filter hook output priority 0; policy drop;

    oifname "lo" accept
    ct state established,related accept

    # DNS + NTP (chrony clock accuracy required for 24h velocity & receipt timeouts)
    udp dport 53 accept
    tcp dport 53 accept
    udp dport 123 accept

    # Outbound HTTPS (BSC RPCs, Telegram alerts, OCI Vault) & PostgreSQL (Neon) + OCI IMDSv2
    tcp dport 443 accept
    tcp dport 5432 accept
    ip daddr 169.254.169.254 tcp dport 80 accept

    counter drop
  }
}
